name: Run isolated WASM tests

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wasi-libc libclang-rt-dev-wasm32

      - name: Build and run every isolated test
        id: run_tests
        run: bash ./run-tests.sh

      - name: Verify required artifacts are tracked and current
        id: verify_artifacts
        if: steps.run_tests.outcome == 'success'
        run: |
          failed=0

          for dir in tests/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            wasm="$dir/$name.wasm"
            log="$dir/$name.log"

            if [ ! -s "$wasm" ]; then
              echo "FAIL required WASM artifact is missing or empty: $wasm"
              failed=1
            fi

            if [ ! -s "$log" ]; then
              echo "FAIL required log artifact is missing or empty: $log"
              failed=1
            fi

            if ! git ls-files --error-unmatch "$wasm" >/dev/null 2>&1; then
              echo "FAIL required WASM artifact is not tracked: $wasm"
              failed=1
            fi

            if ! git ls-files --error-unmatch "$log" >/dev/null 2>&1; then
              echo "FAIL required log artifact is not tracked: $log"
              failed=1
            fi
          done

          if ! git diff --quiet -- 'tests/**/*.wasm' 'tests/**/*.log'; then
            echo "FAIL committed WASM or log artifacts are stale"
            git status --short -- tests
            failed=1
          fi

          exit "$failed"

      - name: Commit regenerated artifacts to pushed branch
        if: always() && github.event_name == 'push' && steps.run_tests.outcome == 'success' && steps.verify_artifacts.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tests/*/*.wasm tests/*/*.log
          git commit -m "Regenerate isolated test artifacts"
          git push

      - name: Upload generated WASM files and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-tests
          path: tests/
          if-no-files-found: error
