name: Run isolated WASM tests

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wasi-libc libclang-rt-dev-wasm32
      - name: Run tests
        run: bash ./run-tests.sh
      - name: Upload test directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-tests
          path: tests/
      - name: Commit generated WASM and logs
        if: github.event_name != 'pull_request' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 'tests/*/*.wasm' 'tests/*/*.log'
          if git diff --cached --quiet; then
            echo "No generated test outputs changed."
          else
            git commit -m "Update isolated test outputs [skip ci]"
            git push
          fi
