name: Run isolated WASM tests

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules