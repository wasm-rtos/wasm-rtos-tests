name: Run isolated WASM tests

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - "run-tests.sh"
      - "wasm-rtos"
      - ".gitmodules"
      - ".github/workflows/run-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: false

      - name: Update wasm-rtos, its vm, and libraries submodules
        run: |
          git submodule sync --recursive
          if [ "${{ github.event_name }}" = "push" ] &&
             [ "${{ github.ref_name }}" = "main" ]; then
            git submodule update --init --remote wasm-rtos
          else
            git submodule update --init wasm-rtos
          fi
          git -C wasm-rtos submodule sync --recursive
          git -C wasm-rtos submodule update --init --recursive
          git submodule update --init libraries
          git submodule status --recursive

          test -f wasm-rtos/os.c
          test -f wasm-rtos/vm/source/wm.h
          test -f libraries/arduino/build.sh

          echo "wasm-rtos commit: $(git -C wasm-rtos rev-parse HEAD)"
          echo "vm commit: $(git -C wasm-rtos/vm rev-parse HEAD)"

      # The WebAssembly toolchain (clang, wasm-ld, wasi-libc and libc++) comes
      # from the WASI SDK release on GitHub, checked against its digest, not
      # from the distribution's package mirrors: the job needs nothing but
      # GitHub to be reachable. The runner's own cc builds the native runners.
      - name: Install toolchain
        env:
          WASI_SDK_VERSION: "34"
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          archive="wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          sdk="$RUNNER_TEMP/wasi-sdk"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/$archive"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$sdk"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$sdk" --strip-components=1
          {
            echo "WASM_CC=$sdk/bin/clang"
            echo "WASM_LD=$sdk/bin/wasm-ld"
            echo "WASI_SYSROOT=$sdk/share/wasi-sysroot"
          } >> "$GITHUB_ENV"
          "$sdk/bin/clang" --version
          cc --version

      - name: Build and run every isolated test
        id: run_tests
        run: bash ./run-tests.sh

      # The runner must produce every artifact. Committed copies are refreshed
      # by the main branch only: pull requests and other branches never get
      # bot commits, so their checks need no manual approval.
      - name: Check generated artifacts
        id: verify_artifacts
        if: steps.run_tests.outcome == 'success'
        run: |
          failed=0
          refresh=0

          for dir in tests/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            for artifact in "$dir/$name.wasm" "$dir/$name.log"; do
              if [ ! -s "$artifact" ]; then
                echo "FAIL required artifact is missing or empty: $artifact"
                failed=1
              elif ! git ls-files --error-unmatch "$artifact" >/dev/null 2>&1; then
                echo "::notice::$artifact is not committed yet; main will add it"
                refresh=1
              fi
            done
          done

          if ! git diff --quiet -- 'tests/**/*.wasm' 'tests/**/*.log'; then
            echo "::notice::Committed WASM or log artifacts differ from this build; main will refresh them"
            git status --short -- tests
            refresh=1
          fi

          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: Commit updated submodule and regenerated artifacts to main
        if: github.event_name == 'push' && github.ref_name == 'main' && steps.verify_artifacts.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add wasm-rtos

          if [ "${{ steps.verify_artifacts.outputs.refresh }}" = "1" ]; then
            git add -f tests/*/*.wasm tests/*/*.log
          fi

          if git diff --cached --quiet; then
            echo "No submodule pointer or generated artifacts changed"
            exit 0
          fi

          if git diff --cached --quiet -- wasm-rtos; then
            commit_message="Regenerate isolated test artifacts"
          elif git diff --cached --quiet -- tests; then
            commit_message="Update wasm-rtos submodule"
          else
            commit_message="Update wasm-rtos submodule and test artifacts"
          fi

          git commit -m "$commit_message"
          git push origin "HEAD:main"

      - name: Upload generated WASM files and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-tests
          path: tests/
          if-no-files-found: error
